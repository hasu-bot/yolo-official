name: YOLO TALENTS checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/talents-current-official-20261102

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
